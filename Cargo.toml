[workspace]
resolver = "2"
members = ["crates/engine", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "unwind"
opt-level = 3

# Debug builds still run the input hook; keep them fast enough that the hook
# callback never comes near Windows' LowLevelHooksTimeout.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
